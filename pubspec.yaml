name: dart_encrypt_suite
description: "dart_encrypt_suite is a Dart/Flutter encryption package that gives developers a single, clean API for AES and RSA encryption , without the boilerplate"
version: 0.0.2
homepage: https://github.com/seyifunmi92/Dart_Encrypt_Suite

environment:
  sdk: '>=3.11.1 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0




